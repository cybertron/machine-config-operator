name: node-valid-hostname.service
enabled: true
contents: |
  [Unit]
  Description=Wait for a non-localhost hostname
  Before=kubelet-dependencies.target

  [Service]
  Type=oneshot
  RemainAfterExit=yes
  User=root
  ExecStart=/usr/local/bin/mco-hostname --wait

  # Wait up to 5min for the node to get a non-localhost name
  TimeoutSec=300

  [Install]
  WantedBy=multi-user.target
  # Ensure that kubelet-dependencies.target will not complete until the node has a non-localhost hostname.
  RequiredBy=kubelet-dependencies.target

